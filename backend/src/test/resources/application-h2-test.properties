# SERVER
server.port=8080

# CORS
frontend.url=http://localhost:5173

# DATABASE
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false
spring.ai.chat.memory.repository.jdbc.initialize-schema=always
spring.ai.model.chat=anthropgitic
spring.ai.model.embedding=none


#SPRING AI - Ollama
spring.ai.ollama.base-url=fakeUrl
spring.ai.ollama.chat.options.model=qwen2.5:7b
spring.ai.ollama.chat.options.temperature=0.7

#JWT
jwt.secret=miclavesupersecretaparajwt123456789
jwt.access-token.expiration-ms=3600000
jwt.refresh-token.expiration-ms=604800000
jwt.cookie.secure=false


# VECTOR STORE - test uses none to avoid requiring EmbeddingModel
spring.ai.vectorstore.type=none
spring.ai.vectorstore.pgvector.initialize-schema=false
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.dimensions=1024
spring.ai.vectorstore.pgvector.table-name=vector_store

# VECTOR MEMORY
app.vector-memory.min-content-length=12
app.vector-memory.max-content-length=4000
app.vector-memory.default-limit=5
app.vector-memory.max-limit=20
app.vector-memory.similarity-threshold=0.65
app.vector-memory.recall-similarity-threshold=0.35