# SERVER
server.port=8080
server.ssl.enabled=false

# CORS
frontend.url=http://localhost:5173
landing.url=http://localhost:3000

# DATABASE
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.flyway.enabled=false
spring.ai.chat.memory.repository.jdbc.initialize-schema=always

# SPRING AI - proveedores activos
app.ai.provider=ollama
spring.ai.chat.client.enabled=false
spring.ai.model.chat=none
spring.ai.model.embedding=none
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
spring.ai.model.image=none
spring.ai.model.moderation=none

# SPRING AI - Ollama
spring.ai.ollama.base-url=fakeUrl
spring.ai.ollama.chat.options.model=qwen2.5:7b
spring.ai.ollama.chat.options.temperature=0.7

# SPRING AI - OpenAI (deshabilitado, evita errores de autoconfigure)
spring.ai.openai.api-key=
spring.ai.openai.embedding.options.model=text-embedding-3-small
spring.ai.openai.embedding.options.dimensions=1024

# SPRING AI - Anthropic (deshabilitado en tests)
spring.ai.anthropic.api-key=
spring.ai.anthropic.chat.options.model=claude-sonnet-4-6
spring.ai.anthropic.chat.options.temperature=0.7

# JWT
jwt.secret=miclavesupersecretaparajwt123456789
jwt.access-token.expiration-ms=3600000
jwt.refresh-token.expiration-ms=604800000
jwt.cookie.secure=false

# SWAGGER
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# VECTOR STORE
spring.ai.vectorstore.type=none
spring.ai.vectorstore.pgvector.initialize-schema=false
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.dimensions=1024
spring.ai.vectorstore.pgvector.table-name=vector_store

# VECTOR MEMORY
app.vector-memory.min-content-length=12
app.vector-memory.max-content-length=4000
app.vector-memory.default-limit=5
app.vector-memory.max-limit=20
app.vector-memory.similarity-threshold=0.65
app.vector-memory.recall-similarity-threshold=0.35

# MercadoPago
mercadopago.access-token=FAKETOKEN
mercadopago.webhook-url=FAKEURL
mercadopago.webhook-secret=FAKESECRET
mercadopago.webhook-validate-signature=true

# VAPID
vapid.public-key=BEl8e2Z9placeholderPublicKeyForTestingPurposesOnlyNotRealVapidKey12345
vapid.private-key=placeholderPrivateKeyForTestingPurposesOnlyNotRealKey
vapid.subject=mailto:test@huly.com