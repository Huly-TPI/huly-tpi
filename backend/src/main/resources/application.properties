spring.application.name=backend
spring.output.ansi.enabled=always

#DATABASE
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

#FLYWAY
spring.flyway.locations=classpath:db/migration
spring.flyway.enabled=true

# Entorno activo
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# SWAGGER - deshabilitado por defecto (se habilita por perfil)
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# VECTOR STORE - el schema lo administra Flyway.
# Por defecto queda desactivado para no exigir un EmbeddingModel en entornos sin proveedor configurado.
spring.ai.vectorstore.type=${VECTOR_STORE_TYPE:none}
spring.ai.vectorstore.pgvector.initialize-schema=false
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.dimensions=${VECTOR_EMBEDDING_DIMENSION:1024}
spring.ai.vectorstore.pgvector.table-name=vector_store

# VECTOR MEMORY
app.vector-memory.min-content-length=${VECTOR_MEMORY_MIN_CONTENT_LENGTH:12}
app.vector-memory.max-content-length=${VECTOR_MEMORY_MAX_CONTENT_LENGTH:4000}
app.vector-memory.default-limit=${VECTOR_MEMORY_DEFAULT_LIMIT:5}
app.vector-memory.max-limit=${VECTOR_MEMORY_MAX_LIMIT:20}
app.vector-memory.similarity-threshold=${VECTOR_MEMORY_SIMILARITY_THRESHOLD:0.65}
