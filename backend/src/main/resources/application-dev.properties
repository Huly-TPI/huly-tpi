spring.config.import=classpath:application-huly-secrets.properties

#SERVER
server.port=${PORT:8080}
server.ssl.key-store-type=PKCS12
server.ssl.key-store=${user.home}/.huly/ssl/localhost.p12
server.ssl.key-store-password=${SSL_KEY_STORE_PASSWORD:secret123}
server.ssl.key-alias=localhost
#cambiar a true para usar https
server.ssl.enabled=false

#JWT
jwt.secret=${JWT_SECRET}
jwt.access-token.expiration-ms=3600000
jwt.refresh-token.expiration-ms=604800000
jwt.cookie.secure=false

#CORS
frontend.url=${FRONTEND_URL}
landing.url=${LANDING_URL}

#DATABASE
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect


#SWAGGER
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true

# ============================================================
# SPRING AI - proveedor de chat activo
# ============================================================
app.ai.provider=anthropic

# --- Anthropic (activo cuando app.ai.provider=anthropic) ---
spring.ai.anthropic.api-key=${ANTHROPIC_API_KEY:}
spring.ai.anthropic.chat.options.model=claude-sonnet-4-6
spring.ai.anthropic.chat.options.temperature=0.7

# MercadoPago
mercadopago.access-token=${MERCADOPAGO_ACCESS_TOKEN:}
mercadopago.webhook-url=${MERCADOPAGO_WEBHOOK_URL:}

# Gmail SMTP - email transaccional (configurar GMAIL_USERNAME + GMAIL_APP_PASSWORD para activar)
spring.mail.host=${GMAIL_HOST:smtp.gmail.com}
spring.mail.port=${GMAIL_PORT:587}
spring.mail.username=${GMAIL_USERNAME:}
spring.mail.password=${GMAIL_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
