

#SERVER
server.port=${PORT}

#CORS
frontend.url=${FRONTEND_URL}

#DATABASE
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

#SWAGGER - habilitado en QA para pruebas del equipo
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true

# ============================================================
# SPRING AI - proveedor de chat activo
# ============================================================
app.ai.provider=${AI_PROVIDER:anthropic}

# --- Anthropic ---
spring.ai.anthropic.api-key=${ANTHROPIC_API_KEY}
spring.ai.anthropic.chat.options.model=${ANTHROPIC_MODEL:claude-sonnet-4-6}
spring.ai.anthropic.chat.options.temperature=${ANTHROPIC_TEMPERATURE:0.7}
