

#SERVER
server.port=${PORT}

#JWT
jwt.secret=${JWT_SECRET}
jwt.access-token.expiration-ms=${JWT_ACCESS_TOKEN_EXPIRATION_MS:3600000}
jwt.refresh-token.expiration-ms=${JWT_REFRESH_TOKEN_EXPIRATION_MS:604800000}
jwt.cookie.secure=true

#CORS
frontend.url=${FRONTEND_URL}

#DATABASE
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

#SWAGGER - habilitado en QA para pruebas del equipo
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true

# ============================================================
# SPRING AI - Proveedor activo: "ollama" | "anthropic"
# ============================================================
app.ai.provider=${AI_PROVIDER:anthropic}

# --- Ollama ---
spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
spring.ai.ollama.chat.options.model=${OLLAMA_MODEL:qwen2.5:7b}
spring.ai.ollama.chat.options.temperature=${OLLAMA_TEMPERATURE:0.7}

# --- Anthropic ---
spring.ai.anthropic.api-key=${ANTHROPIC_API_KEY}
spring.ai.anthropic.chat.options.model=${ANTHROPIC_MODEL:claude-sonnet-4-6}
spring.ai.anthropic.chat.options.temperature=${ANTHROPIC_TEMPERATURE:0.7}