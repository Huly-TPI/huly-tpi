

#SERVER
server.port=${PORT}

#JWT
jwt.secret=${JWT_SECRET}
jwt.access-token.expiration-ms=${JWT_ACCESS_TOKEN_EXPIRATION_MS:3600000}
jwt.refresh-token.expiration-ms=${JWT_REFRESH_TOKEN_EXPIRATION_MS:604800000}
jwt.cookie.secure=true

#CORS
frontend.url=${FRONTEND_URL}
backend.url=${BACKEND_URL}
landing.url=${LANDING_URL}
extension.url=${EXTENSION_URL}

#DATABASE
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

#SWAGGER - habilitado en QA para pruebas del equipo
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true

# ============================================================
# SPRING AI - proveedor de chat activo
# ============================================================
app.ai.provider=${AI_PROVIDER:anthropic}

# --- Anthropic ---
spring.ai.anthropic.api-key=${ANTHROPIC_API_KEY}
spring.ai.anthropic.chat.options.model=${ANTHROPIC_MODEL:claude-sonnet-4-6}
spring.ai.anthropic.chat.options.temperature=${ANTHROPIC_TEMPERATURE:0.7}

# MercadoPago
mercadopago.access-token=${MERCADOPAGO_ACCESS_TOKEN:}
mercadopago.webhook-url=${MERCADOPAGO_WEBHOOK_URL:}
mercadopago.webhook-secret=${MERCADOPAGO_WEBHOOK_SECRET:}
mercadopago.webhook-validate-signature=false

# Gmail SMTP - email transaccional
spring.mail.host=${GMAIL_HOST:smtp.gmail.com}
spring.mail.port=${GMAIL_PORT:587}
spring.mail.username=${GMAIL_USERNAME}
spring.mail.password=${GMAIL_APP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
