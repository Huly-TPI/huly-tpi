# .GitHub/workflows/CI.yml
name: CI Build

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

on:
  push:
    # sin 'branches' -> dispara en TODAS las branches
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'sensevoice-service/**'
      - '.github/workflows/CI.yml'

  pull_request:
    branches: [ main, dev ]
    types: [opened, reopened, synchronize, edited]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'sensevoice-service/**'
      - '.github/workflows/CI.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:


  # SOLO CONTROL DE PRs HACIA MAIN

  restrict-main-pr:
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'pull_request' &&
      github.base_ref == 'main'

    steps:
      - name: Show context
        run: |
          echo "=== PR CONTEXT ==="
          echo "EVENT:       ${{ github.event_name }}"
          echo "BASE REF:    ${{ github.base_ref }}"
          echo "HEAD REF:    ${{ github.head_ref }}"
          echo "RUN ATTEMPT: ${{ github.run_attempt }}"
          echo "==============="

      - name: Block PRs to main unless from stg
        run: |
          if [[ "${{ github.head_ref }}" != "stg" ]]; then
            echo "❌ Solo se permiten PRs a main desde 'stg'."
            echo "HEAD = '${{ github.head_ref }}', BASE = '${{ github.base_ref }}'"
            exit 1
          fi

          echo "✔ PR válido hacia main"


  # FRONTEND BUILD — TODAS LAS BRANCHES

  build-frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build


  # BACKEND BUILD — TODAS LAS BRANCHES

  build-backend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Build backend with Maven
        run: mvn clean install -DskipTests=true



  # TEST COVERAGE — SOLO PR A DEV

  test-coverage:
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'pull_request' &&
      github.base_ref == 'dev'

    permissions:
      contents: read
      pull-requests: write

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Run tests with coverage
        run: mvn verify -Dspring.profiles.active=h2-test

      - name: Coverage summary
        run: |
          pct=$(python3 -c "
          import xml.etree.ElementTree as ET
          tree = ET.parse('target/site/jacoco/jacoco.xml')
          for c in tree.getroot().findall('counter'):
              if c.get('type') == 'LINE':
                  cov, mis = int(c.get('covered')), int(c.get('missed'))
                  tot = cov + mis
                  print(f'{cov/tot*100:.1f}' if tot else '0.0')
                  break
          ")
          echo "## Test Coverage" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Line coverage | **${pct}%** |" >> $GITHUB_STEP_SUMMARY

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: backend/target/site/jacoco/

      - name: Post coverage comment on PR
        id: jacoco
        if: github.event_name == 'pull_request'
        uses: madrapps/jacoco-report@v1.7.2
        with:
          paths: backend/target/site/jacoco/jacoco.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          title: 'Test Coverage'
          min-coverage-overall: 80
          min-coverage-changed-files: 0

      - name: Enforce minimum coverage (80%)
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const coverage = parseFloat('${{ steps.jacoco.outputs.coverage-overall }}')
            core.info(`Cobertura general: ${coverage}%`)
            if (isNaN(coverage) || coverage < 80) {
              core.setFailed(`❌ Cobertura ${coverage}% por debajo del mínimo requerido (80%).`)
            } else {
              core.info('✔ Cobertura cumple el mínimo de 80%.')
            }


  # SENSEVOICE TESTS — SOLO PR A DEV

  test-sensevoice:
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'pull_request' &&
      github.base_ref == 'dev'

    defaults:
      run:
        working-directory: sensevoice-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: sensevoice-service/requirements.txt

      - name: Install torch (CPU-only)
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest tests/ -v
